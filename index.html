
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Gallery Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>My Creative Dashboard</h1>
    <p>Welcome to my Gallery</p>
</header>

<nav class="navbar">
    <a href="#">Home</a>
    <a href="#gallery">Gallery</a>
    <a href="#dashboard">Dashboard</a>
    <a href="#">About</a>
</nav>

<main>
    <section id="gallery">
        <h2>My Photo Gallery</h2>
        <div class="gallery">
            <div class="photo photo1">Nature</div>
            <div class="photo photo2">Mountains</div>
            <div class="photo photo3">Ocean</div>
            <div class="photo photo4">Forest</div>
            <div class="photo photo5">Sunset</div>
            <div class="photo photo6">Travel</div>
        </div>
    </section>

    <section id="dashboard">
        <h2>Dashboard Overview</h2>
        <div class="cards">
            <div class="card">📸<h3>120</h3><p>Photos</p></div>
            <div class="card">👥<h3>85</h3><p>Visitors</p></div>
            <div class="card">⭐<h3>45</h3><p>Favorites</p></div>
        </div>
    </section>
</main>

<footer>
    <p>Created by Raghav Mishra | Day 08 Project</p>
</footer>

</body>
</html>
